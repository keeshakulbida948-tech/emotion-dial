[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emotion-dial"
version = "0.1.0"
description = "A no-training toolkit to find, read and steer emotion directions inside causal language models."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "keeshakulbida948-tech" }]
keywords = [
  "interpretability", "mechanistic-interpretability", "activation-steering",
  "representation-engineering", "emotion", "llm", "transformers", "qwen",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.2",
  "transformers>=4.44",
  "numpy",
]

[project.optional-dependencies]
viz = ["matplotlib"]
quant = ["bitsandbytes"]
dev = ["pytest"]

[project.scripts]
emotion-dial = "emotion_dial.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
